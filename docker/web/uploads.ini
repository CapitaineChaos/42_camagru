; Montage sources: a phone photo goes past the 2M default
upload_max_filesize = 8M
; Webcam captures travel as a base64 data URL, one third heavier than the file
post_max_size = 12M

; The images ship no php.ini, so the compiled defaults apply and display_errors
; is on: a notice would land in the middle of the HTML. Nothing is printed to the
; page; log_errors without error_log hands everything to the SAPI, which for
; apache means its own error log, itself a link to /dev/stderr. Everything ends
; up in the container stream: make php_error.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
