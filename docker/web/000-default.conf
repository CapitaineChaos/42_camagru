# Nom du serveur, sinon apache le devine depuis l'IP du conteneur et prévient
# à chaque démarrage (AH00558). Hors du VirtualHost : la directive est globale.
ServerName localhost

# Déclarer un site qui ecoute sur 80
<VirtualHost *:80>

    # Le répertoire racine du site est public
    DocumentRoot /var/www/html/public

    # En-têtes de sécurité, posés sur toutes les réponses du site, erreurs
    # comprises. always : sinon Apache les omet hors réponses 2xx/3xx.

    # Les octets servis par /photo et /avatar sortent en readfile : le type
    # annoncé fait foi, le navigateur ne devine pas.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"

    # Filet sous l'échappement des vues : une injection résiduelle ne charge
    # ni script ni style tiers. frame-ancestors remplace X-Frame-Options.
    # style-src-attr : le photomaton pose le ratio de la scène en attribut
    # style, la valeur venant de photobooth.width/height (config/settings.php).
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; style-src-attr 'unsafe-inline'; script-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"

    # Début des regles appliquées au répertoire public
    <Directory /var/www/html/public>
        # Interdit de lister un dossier, autorise les liens symboliques
        Options -Indexes +FollowSymLinks

        # Désactive les directives .htaccess
        AllowOverride None

        # Autorise l'accès à tout le dossier
        Require all granted

        # Front controller : Activer la réécriture d'URL pour rediriger les requêtes
        RewriteEngine On
        # Si l'URL ne correspond pas à un fichier
        RewriteCond %{REQUEST_FILENAME} !-f
        # ou à un dossier
        RewriteCond %{REQUEST_FILENAME} !-d
        # alors redirige vers index.php
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # Erreurs Apache
    ErrorLog ${APACHE_LOG_DIR}/error.log
    # Erreurs access HTTP
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
