services:
  web:
    build:
      context: ./docker/web
      args:
        UID: ${CAMAGRU_UID:-1000}
        GID: ${CAMAGRU_GID:-1000}
    container_name: camagru-web
    ports:
      - "8080:80"
    volumes:
      - ./camagru/public:/var/www/html/public
      - ./camagru/app:/var/www/html/app
      - ./camagru/config:/var/www/html/config
      - ./camagru/database:/var/www/html/database
      - ./camagru/storage:/var/www/html/storage
      - images-data:/var/www/html/storage/images
      - ./secrets:/run/secrets:ro
    env_file: .env
    depends_on:
      - db
      - mailhog

  db:
    image: docker.io/library/postgres:16-alpine
    container_name: camagru-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      # the entrypoint reads these files itself: the password never lands in the
      # container environment, where a docker inspect would print it
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./camagru/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./secrets:/run/secrets:ro
    ports:
      - "5432:5432"

  mailhog:
    image: docker.io/mailhog/mailhog:latest
    container_name: camagru-mailhog
    ports:
      - "1025:1025"   # SMTP app
      - "8025:8025"   # Interface web : http://localhost:8025

# device: absolute path only
volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CAMAGRU_DATA:-/tmp/42_camagru/.data}/postgres
  images-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CAMAGRU_DATA:-/tmp/42_camagru/.data}/images
