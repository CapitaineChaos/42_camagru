services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        UID: ${CAMAGRU_UID}
        GID: ${CAMAGRU_GID}
    container_name: ${WEB_CONTAINER}
    ports:
      - "8080:80"
    volumes:
      - images-data:/var/www/html/storage/images
      - avatars-data:/var/www/html/storage/avatars
    env_file: .env
    depends_on:
      - db
      - mailhog

  db:
    image: docker.io/library/postgres:16-alpine
    container_name: ${DB_CONTAINER}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    # initdb.d : joués par ordre de nom, seulement sur une base vide
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./camagru/database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./camagru/database/admin.sh:/docker-entrypoint-initdb.d/20-admin.sh:ro

  mailhog:
    image: docker.io/mailhog/mailhog:latest
    container_name: ${MAILHOG_CONTAINER}
    ports:
      - "1025:1025"   # SMTP app
      - "8025:8025"   # Interface web : http://localhost:8025

volumes:
  db-data:
  images-data:
  avatars-data:
